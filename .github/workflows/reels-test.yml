name: reels-test
on:
  push:
    branches: [reels-test]
    paths-ignore: ['reels/out/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk fonts-noto-cjk-extra
      - run: pip install -q edge-tts pillow
      - name: Render reels (female + male voice)
        run: |
          mkdir -p out
          for f in reels/*.json; do
            name=$(basename "$f" .json)
            for v in ko-KR-SunHiNeural ko-KR-InJoonNeural; do
              python3 -c "import json,sys;d=json.load(open('$f'));d['voice']='$v';json.dump(d,open('/tmp/s.json','w'),ensure_ascii=False)"
              python3 -m cardnews.reels /tmp/s.json "out/${name}-${v}.mp4"
            done
          done
          ls -la out
      - name: Save videos to branch
        run: |
          mkdir -p reels/out && cp out/*.mp4 reels/out/
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add reels/out && git commit -m "릴스 시험 영상 [skip ci]" && git push
