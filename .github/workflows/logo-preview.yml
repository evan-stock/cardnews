name: logo-preview
on:
  push:
    branches: [reels-test]
    paths: ['logo/preview.html','logo/shot.py']
permissions:
  contents: write
jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q playwright && python -m playwright install --with-deps chromium
      - run: python logo/shot.py
      - run: |
          git config user.name github-actions && git config user.email actions@github.com
          git add logo/*.png && git commit -m "logo preview [skip ci]" && git push
