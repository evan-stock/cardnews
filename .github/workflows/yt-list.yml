name: yt-list
# drafts/yt_list.json {"urls":[채널 쇼츠 탭 주소...]} → state/bench/<handle>.tsv (조회수·제목·주소)
on:
  push:
    paths: ["drafts/yt_list.json"]
permissions:
  contents: write
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q -U "yt-dlp[default]"
      - name: list
        run: |
          mkdir -p state/bench
          for u in $(python3 -c "import json;print('\n'.join(json.load(open('drafts/yt_list.json'))['urls']))"); do
            name=$(python3 -c "import sys,urllib.parse;print(urllib.parse.unquote(sys.argv[1]).split('@')[1].split('/')[0])" "$u")
            yt-dlp --flat-playlist -J "$u" > /tmp/l.json 2>>state/bench/log.txt || true
            python3 - "$name" <<'EOF'
          import json,sys
          d=json.load(open('/tmp/l.json'))
          rows=sorted(d.get('entries') or [], key=lambda e:-(e.get('view_count') or 0))
          with open(f"state/bench/{sys.argv[1]}.tsv","w") as f:
              for i,e in enumerate(d.get('entries') or []):
                  f.write(f"{i}\t{e.get('view_count')}\t{e.get('title')}\t{e.get('url')}\n")
          EOF
          done
      - run: |
          git config user.name cardnews-bot; git config user.email cardnews-bot@users.noreply.github.com
          git add -A state/bench
          git diff --cached --quiet || (git commit -m "bench: list" && git pull --rebase && git push)
