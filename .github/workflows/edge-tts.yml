name: edge-tts
# drafts/edge_tts.json {"out":"media/<id>/tts/nar","voice":"ko-KR-SunHiNeural","rate":"+12%","text":"..."}
# → <out>.mp3 + <out>.json(단어별 시각, edge-tts 단어 경계) 저장. Gemini TTS 하루 한도(10회) 넘었을 때 예비(2026.11.06).
on:
  push:
    paths: ["drafts/edge_tts.json"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q edge-tts
      - run: |
          python3 - <<'PY'
          import json, os, asyncio, edge_tts
          c=json.load(open('drafts/edge_tts.json')); out=c['out']; os.makedirs(os.path.dirname(out),exist_ok=True)
          async def go():
              words=[]
              tts=edge_tts.Communicate(c['text'], c.get('voice','ko-KR-SunHiNeural'), rate=c.get('rate','+0%'), pitch=c.get('pitch','+0Hz'), boundary='WordBoundary')
              with open(out+'.mp3','wb') as f:
                  async for ch in tts.stream():
                      if ch['type']=='audio': f.write(ch['data'])
                      elif ch['type']=='WordBoundary': words.append({'w':ch['text'],'s':ch['offset']/1e7,'e':(ch['offset']+ch['duration'])/1e7})
              json.dump(words,open(out+'.json','w'),ensure_ascii=False,indent=1)
              print(len(words),'words')
          asyncio.run(go())
          PY
      - run: |
          git config user.name cardnews-bot; git config user.email cardnews-bot@users.noreply.github.com
          git add -A media
          git diff --cached --quiet || { git commit -m "edge-tts"; for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((i*7)); done; }
