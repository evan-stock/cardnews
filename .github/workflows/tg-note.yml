name: tg-note
# 2026.11.10: state/tg_outbox/*.md 를 텔레그램으로 보내고 지움(소재 추천 알림)
on:
  push:
    paths: ["state/tg_outbox/*.md", "!state/tg_outbox/README.md"]
  workflow_dispatch:
concurrency: {group: tg-note, cancel-in-progress: false}
permissions: {contents: write}
jobs:
  send:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TZ: Asia/Seoul
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: "cardnews\nscripts/tg_note.py\nstate/tg_outbox", sparse-checkout-cone-mode: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q requests pyyaml
      - run: python scripts/tg_note.py
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A state/tg_outbox
          git diff --cached --quiet || { git commit -m "tg-note: sent"; for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((i*7)); done; }
