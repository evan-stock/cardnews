name: life-shorts
# 댓글로 키우는 아이(새 채널 life, 2026.10.23): drafts/life.json → media/<id>/short.mp4
# mode=render: 영상만 만든다. mode=send: 새 텔레그램 봇(TELEGRAM_BOT_TOKEN_LIFE)으로 미리보기 + [✅ 업로드]
#   → 승인되면 pipeline watch 가 새 채널(YT_REFRESH_TOKEN_LIFE)에 올린다. 털뭉치(drafts/shorts.json·기본 봇)와 분리.
on:
  push:
    paths: ["drafts/life.json"]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: life-shorts
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN_LIFE: ${{ secrets.TELEGRAM_BOT_TOKEN_LIFE }}
      TELEGRAM_CHAT_ID_LIFE: ${{ secrets.TELEGRAM_CHAT_ID_LIFE }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt && sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk ffmpeg
      - name: 렌더
        run: |
          mkdir -p state
          set -o pipefail
          python -m cardnews.shorts drafts/life.json 2>&1 | tee state/life_log.txt
      - if: always()
        run: |
          git config user.name cardnews-bot; git config user.email cardnews-bot@users.noreply.github.com
          id=$(python -c "import json;print(json.load(open('drafts/life.json'))['id'])")
          git add -A "media/$id" state/life_log.txt
          [ -f "state/posts/$id.json" ] && git add "state/posts/$id.json"
          git diff --cached --quiet || { git commit -m "life: render $id"; for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((i*7)); done; }
      - name: 승인 대기 감시 시작(send 일 때)
        if: success()
        run: |
          if grep -q '"mode": *"send"' drafts/life.json; then gh workflow run pipeline.yml -f cmd=watch; fi
        env:
          GH_TOKEN: ${{ github.token }}
