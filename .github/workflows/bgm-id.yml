name: bgm-id
# 2026.10.28: 잘난지 쇼츠 배경음악 식별(yt-dlp 오디오 + Shazam). drafts/bgm_id.txt 의 주소 목록이 바뀌면 실행.
on:
  push:
    paths: ["drafts/bgm_id.txt"]
permissions:
  contents: write
jobs:
  id:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get install -y -qq ffmpeg && pip install -q -U "yt-dlp[default,curl-cffi]" shazamio && (curl -fsSL https://deno.land/install.sh | sh -s -- -y >/dev/null 2>&1 && echo "$HOME/.deno/bin" >> $GITHUB_PATH || true)
      - run: |
          mkdir -p bgmid
          while read -r u; do [ -z "$u" ] && continue
            yt-dlp -q --no-playlist -f "ba/b" --write-info-json -o "bgmid/%(id)s.%(ext)s" "$u" 2>>bgmid_log.txt || echo "실패 $u" >> bgmid_log.txt
          done < drafts/bgm_id.txt
          ls bgmid; tail -20 bgmid_log.txt || true
      - run: python scripts/bgm_identify.py || true
      - run: |
          cp bgmid_log.txt state/bench/bgm_id_log.txt 2>/dev/null || true
          git config user.name cardnews-bot; git config user.email cardnews-bot@users.noreply.github.com
          git add state/bench/bgm_id.tsv state/bench/bgm_id_log.txt && git commit -m "bench: bgm id" && git pull --rebase && git push
