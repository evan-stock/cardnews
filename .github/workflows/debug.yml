name: debug-probe
on:
  push:
    paths: ["debug/probe.py"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests && python debug/probe.py
      - run: |
          git config user.name cardnews-bot; git config user.email cardnews-bot@users.noreply.github.com
          git add debug/probe_result.json && git commit -m "debug: probe result" && git pull --rebase && git push
