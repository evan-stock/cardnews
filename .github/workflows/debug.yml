name: debug-rerender
on:
  push:
    paths: ["debug/rerender.py", "debug/trigger.txt"]
permissions:
  contents: write
jobs:
  rerender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt && sudo apt-get install -y -qq fonts-noto-cjk && python -m playwright install --with-deps chromium
      - env: {ANTHROPIC_API_KEY: ""}  # 2026.10.18 API 사용 중지
        run: python debug/rerender.py "$(cat debug/trigger.txt)"
      - run: |
          git config user.name cardnews-bot; git config user.email cardnews-bot@users.noreply.github.com
          git add -A media && git commit -m "debug: rerender" && git pull --rebase && git push
