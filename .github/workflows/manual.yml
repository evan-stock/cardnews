name: manual-draft
# 채팅에서 쓴 원고(drafts/current.json)를 렌더링. Claude API 비용 없음.
on:
  push:
    paths: ["drafts/current.json"]
permissions:
  contents: write
  actions: write
concurrency:
  group: manual
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25  # 2026.10.23: 설치가 멈춰도 뒤 원고를 30분 넘게 막지 않게
    env:
      TZ: Asia/Seoul
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - name: 설치(시간 제한+재시도)
        timeout-minutes: 15
        run: bash scripts/ci_install.sh fonts-noto-cjk ffmpeg
      - run: python -m cardnews.manual drafts/current.json
      - if: always()
        run: |
          git config user.name cardnews-bot; git config user.email cardnews-bot@users.noreply.github.com
          git add -A media state
          git diff --cached --quiet || { git commit -m "manual: render"; for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((i*7)); done; }
      - name: 게시 대기 감시 시작
        run: |
          if grep -q '"mode": *"send"' drafts/current.json; then
            gh workflow run pipeline.yml -f cmd=watch
          fi
        env:
          GH_TOKEN: ${{ github.token }}
