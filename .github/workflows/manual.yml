name: manual-draft
# 채팅에서 쓴 원고(drafts/current.json)를 렌더링. Claude API 비용 없음.
on:
  push:
    paths: ["drafts/current.json"]
permissions:
  contents: write
  actions: write
concurrency:
  group: manual
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt && sudo apt-get install -y -qq fonts-noto-cjk ffmpeg && python -m playwright install --with-deps chromium
      - run: python -m cardnews.manual drafts/current.json
      - if: always()
        run: |
          git config user.name cardnews-bot; git config user.email cardnews-bot@users.noreply.github.com
          git add -A media state
          git diff --cached --quiet || { git commit -m "manual: render"; for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((i*7)); done; }
      - name: 게시 대기 감시 시작
        run: |
          if grep -q '"mode": *"send"' drafts/current.json; then
            gh workflow run pipeline.yml -f cmd=watch
          fi
        env:
          GH_TOKEN: ${{ github.token }}
