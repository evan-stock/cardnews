name: thumb
# drafts/thumb.json → media/<id>/reel_cover.jpg (릴스 커버)
on:
  push:
    paths: ["drafts/thumb.json", "templates/thumb.html", "cardnews/thumb.py"]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt && sudo apt-get install -y -qq fonts-noto-cjk && python -m playwright install --with-deps chromium
      - run: python -m cardnews.thumb drafts/thumb.json
      - run: |
          git config user.name cardnews-bot; git config user.email cardnews-bot@users.noreply.github.com
          git add -A media
          git diff --cached --quiet || (git commit -m "thumb: render" && git pull --rebase && git push)
