name: thumb
# drafts/thumb.json → media/<id>/reel_cover.jpg (릴스 커버)
on:
  push:
    paths: ["drafts/thumb.json", "templates/thumb.html", "cardnews/thumb.py"]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25  # 2026.10.23: 설치가 멈춰도 뒤 원고를 30분 넘게 막지 않게
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - name: 설치(시간 제한+재시도)
        timeout-minutes: 15
        run: bash scripts/ci_install.sh fonts-noto-cjk
      - run: python -m cardnews.thumb drafts/thumb.json
      - run: |
          git config user.name cardnews-bot; git config user.email cardnews-bot@users.noreply.github.com
          git add -A media
          git diff --cached --quiet || { git commit -m "thumb: render"; for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((i*7)); done; }
