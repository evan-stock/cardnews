name: shorts
# 채팅에서 쓴 쇼츠 원고(drafts/shorts.json)로 영상을 만들고(TTS 내레이션·자막),
# mode=send 면 텔레그램 미리보기 + [✅ 업로드] 버튼 → 승인되면 pipeline watch가 유튜브에 올린다.
on:
  push:
    paths: ["drafts/shorts.json"]
  workflow_dispatch:
    inputs:
      cmd:
        description: "render(원고로 영상) | voices(타입캐스트 목소리 목록) | yt-check(유튜브 연결 확인)"
        default: render
      q:
        description: "voices일 때 목소리 이름 검색(예: 필재). 비우면 쇼츠용 목록"
        default: ""
permissions:
  contents: write
  actions: write
concurrency:
  group: shorts
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Asia/Seoul
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TYPECAST_API_KEY: ${{ secrets.TYPECAST_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YT_REFRESH_TOKEN_SHOP: ${{ secrets.YT_REFRESH_TOKEN_SHOP }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt edge-tts && sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra ffmpeg
      - name: 실행
        run: |
          mkdir -p state
          set -o pipefail
          cmd="${{ inputs.cmd || 'render' }}"
          case "$cmd" in
            voices) python -m cardnews.tts voices "${{ inputs.q }}" ;;
            yt-check) python -m cardnews.youtube check "${{ inputs.q }}" ;;
            *) if [ ! -f drafts/shorts.json ]; then
                 echo "drafts/shorts.json 이 아직 없어요. 목소리 목록은 cmd 칸에 voices 를 넣고 실행하세요."; exit 1; fi
               python -m cardnews.shorts drafts/shorts.json ;;
          esac 2>&1 | tee state/shorts_log.txt
      - name: 실패 알림
        if: failure()
        run: |
          python - <<'PY'
          import os, requests
          t = open("state/shorts_log.txt", encoding="utf-8", errors="ignore").read()[-1500:] if os.path.exists("state/shorts_log.txt") else "로그 없음"
          tok, chat = os.environ.get("TELEGRAM_BOT_TOKEN"), os.environ.get("TELEGRAM_CHAT_ID")
          if tok and chat:
              requests.post(f"https://api.telegram.org/bot{tok}/sendMessage", data={"chat_id": chat, "text": "⚠️ 쇼츠 실행 실패\n\n" + t})
          PY
      - if: always()
        run: |
          git config user.name cardnews-bot; git config user.email cardnews-bot@users.noreply.github.com
          git add -A media state
          git diff --cached --quiet || (git commit -m "shorts: render" && git pull --rebase && git push)
      - name: 승인 대기 감시 시작
        run: |
          if [ -f drafts/shorts.json ] && grep -q '"mode": *"send"' drafts/shorts.json; then
            gh workflow run pipeline.yml -f cmd=watch
          fi
        env:
          GH_TOKEN: ${{ github.token }}
