name: gemini-image
# drafts/gemini_image.json → scripts/gemini_image/gen.py → state/gemini_image/
on:
  push:
    paths: ["drafts/gemini_image.json"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: "scripts/gemini_image\ndrafts\nstate/gemini_image", fetch-depth: 1}
      - run: pip install -q requests
      - run: python3 scripts/gemini_image/gen.py 2>&1 | tee state/gemini_image/log.txt
      - if: always()
        run: |
          git config user.name cardnews-bot; git config user.email cardnews-bot@users.noreply.github.com
          git add -A state/gemini_image
          git diff --cached --quiet || git commit -m "gemini-image: 목표 그림"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 5; done
