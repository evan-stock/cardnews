# 오늘의쓸모 카드뉴스 자동화 설정
timezone: Asia/Seoul

brand:
  channel_name: 오늘의쓸모
  handle: "@today.worthy"

# 하루 두 번 게시. prepare 시각에 소재·카드를 만들어 텔레그램으로 보내고,
# 승인되면 publish 시각에 게시합니다. (실제 실행 시각은 .github/workflows/pipeline.yml의 cron)
slots:
  lunch:
    publish_at: "13:00"
  evening:
    publish_at: "18:00"

approval:
  # 게시 시각으로부터 이 시간이 지나도 승인 안 되면 만료 처리
  expire_hours: 3

research:
  model: claude-sonnet-5-5
  max_tokens: 8000
  web_search_max_uses: 12
  web_fetch_max_uses: 6
  slides: 7            # 마지막 1장은 팔로우 카드
  avoid_days: 14       # 최근 n일 안에 다룬 소재는 제외
  # 2026.10.14 진단 반영: 공유(DM)가 잘 되는 인물·황당 사연 위주, 정치·코인은 크게 바이럴일 때만
  categories: [해외 황당·기묘 인물 사연, 국내 셀럽·사회 공감·분노 논란, 숫자·반전 인물 서사(돈·성공·몰락), 신기한 과학·사진, 정치·코인(초대형 바이럴일 때만)]

style:
  sty: photo           # photo | bold | mag | min
  col: 2               # 0 초록, 1 갈색, 2 네이비, 3 밝은색 (사진 없을 때 배경)

images:
  press: true          # 출처 기사·유튜브·틱톡 원본 사진 우선 사용
  commons: false       # true면 기사 사진이 모자랄 때 위키미디어 사진으로 채움(이야기와 무관한 사진이 섞일 수 있음)
  ai_fallback: openai  # openai | none  (OPENAI_API_KEY가 있을 때만 동작)
  openai_model: gpt-image-1
  openai_size: 1024x1536

# 릴스: 게시 때 카드뉴스 전체를 자동으로 넘기는 9:16 영상(무음, 잘림 없음)을 만들어 텔레그램으로 보내고,
# mode=auto 면 카드뉴스 게시 직후 릴스도 자동 업로드한다(음악은 앱에서 추가).
reels:
  enabled: true
  mode: telegram        # auto | telegram (telegram: 영상만 텔레그램으로 보내고 업로드는 직접)
  share_to_feed: false  # false: 프로필 격자에 표지가 두 번 안 보이게 릴스 탭에만
  first_card: 2.0       # 표지 노출 초
  per_card: 3.0         # 나머지 카드 한 장당 초

# 스토리: 카드뉴스 게시 직후 표지를 9:16 스토리로 자동 게시(API라 게시물 링크 스티커는 못 붙임)
stories:
  enabled: false        # 스토리는 앱에서 직접 공유(게시물 스티커가 붙어 눌러서 이동 가능)
  top_text: "새 게시물"
  bottom_text: "프로필에서 전체 보기"

instagram:
  api_host: https://graph.instagram.com
  api_version: v25.0

# 유튜브 쇼츠(채팅 원고 drafts/shorts.json → .github/workflows/shorts.yml). 설명: docs/SHORTS.md
shorts:
  layout: band          # band = A안(2026.10.17 확정): 위 검정 띠 + 2줄 제목(노랑/흰), 띠 아래 영상 꽉 채움
  band: 430             # 검정 띠 높이(px)
  tag: false            # 띠 아래 빨간 '● 실제 영상' 태그 (2026.10.17 사용자 요청으로 끔)
  mascot: assets/mascot_a.png   # 오늘의 털뭉치 노랑 털뭉치(2026.10.17 확정), 오른쪽 아래에 표시
  title_size: 96        # 위쪽 제목 글자 크기
  sub_size: 116         # 자막 글자 크기(2026.10.17 키움: 82는 폰에서 너무 작음)
  sub_y: 0.68           # 자막 세로 위치(화면 높이 비율)
  chunk: 8              # 자막 한 덩어리 최대 글자 수(공백 제외, 큰 글씨에 맞춰 짧게)
  zoom: 0.10            # 사진 장면 확대 정도
  video_audio: 0.0      # 실제 영상 원본 소리 크기(0=끔, 장면별 "audio"로 덮어쓰기)
  bgm: null             # 기본 배경음악(assets/bgm/*.mp3, 저작권 없는 곡만)
  bgm_volume: 0.10
  category: 24          # 24 엔터테인먼트, 22 인물·블로그, 28 과학기술
  tts:
    engine: typecast    # typecast → 실패·한도 초과 시 edge 자동 대체 | edge | silent(시험용)
    model: ssfm-v30
    voice_id: tc_68257f68bc6e3c161ab5078d   # 필재(기본). 바꾸려면 채팅에서 "목소리 ○○로 바꿔줘"
    emotion: smart      # smart(앞뒤 문장 보고 억양 자동, 추천) | normal | happy | sad | angry | whisper | toneup | tonedown
    intensity: 1.0
    tempo: 1.1          # 쇼츠는 1.1~1.2배가 자연스러움
    monthly_cap: 28000  # 무료 플랜 월 30,000자 중 여유 2,000자 남기고 edge로 전환
    edge_voice: ko-KR-InJoonNeural   # 무료 대체: InJoon(남) / SunHi(여)
    edge_rate: "+15%"
  channels:             # 원고 yt.channel 값별 기본값(원고의 voice·style이 있으면 그게 우선)
    shop:               # 쇼핑 쇼츠 채널(예정)
      voice: {voice_id: tc_632293f759d649937b97f323}   # 진우(남 20대, 밝은 톤) — 2026.10.17 사용자 지정
      style: {}
