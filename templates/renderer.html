<html lang="ko"><head><meta charset="utf-8">

<title>카드뉴스 메이커</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141417;--pn:#202024;--tx:#f2f2f4;--mu:#9a9aa4;--bd:#34343b;--ac:#8b7dff;--sl:#2a2840}}
:root[data-theme="dark"]{--bg:#141417;--pn:#202024;--tx:#f2f2f4;--mu:#9a9aa4;--bd:#34343b;--ac:#8b7dff;--sl:#2a2840}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.5}
.w{max-width:900px;margin:0 auto;padding:20px 14px 60px}h1{font-size:22px;margin:0 0 2px}.sub{color:var(--mu);font-size:14px;margin:0 0 16px}
.p{background:var(--pn);border-radius:14px;padding:16px;margin-bottom:12px;border:1px solid var(--bd)}
h3{font-size:14px;margin:0 0 10px}label{font-size:12px;color:var(--mu);display:block;margin:0 0 4px}
input,textarea{width:100%;font:inherit;font-size:14px;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px 10px}
textarea{resize:vertical}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:150px}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{flex:1;min-width:110px;text-align:left;background:var(--pn);color:var(--tx);border:1.5px solid var(--bd);border-radius:10px;padding:8px 10px;font-size:13px;font-weight:700}
.chip small{display:block;font-weight:400;color:var(--mu);font-size:11px}.chip.on{border-color:var(--ac);background:var(--sl);color:var(--ac)}
.sw{flex:none;min-width:0;width:46px;height:46px;padding:0;border-radius:10px}.sw.on{outline:3px solid var(--ac);outline-offset:2px}
button{font:inherit;font-size:14px;font-weight:700;border:0;border-radius:9px;padding:11px 16px;cursor:pointer;background:var(--ac);color:#fff}
button.g{background:var(--pn);color:var(--tx);border:1px solid var(--bd)}button:disabled{opacity:.5}
.big{width:100%;padding:14px;font-size:15px}.msg{font-size:13px;color:var(--mu);margin-top:8px;min-height:18px}
.hk{display:block;width:100%;text-align:left;background:var(--pn);color:var(--tx);border:1.5px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.nl{text-decoration:none;text-align:center;min-width:0;flex:none}.hk:hover{border-color:var(--ac)}.hk b{font-size:12px;color:var(--ac)}.hk i{float:right;font-style:normal;font-size:12px;color:#e08a00}.hk p{margin:4px 0 2px;font-size:15px}.hk small{color:var(--mu);font-weight:400;font-size:12px}
#strip{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 10px}.cd{flex:none;width:220px;text-align:center;font-size:12px;color:var(--mu)}
.cd canvas{width:220px;height:275px;border-radius:10px;cursor:pointer;border:2px solid transparent;display:block;margin-bottom:6px}.cd.on canvas{border-color:var(--ac)}
.cd button{padding:5px 10px;font-size:12px;margin-top:4px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.bar>*{flex:1}
.tags a{color:var(--ac)}.tags{font-size:12px;color:var(--mu);margin-top:8px;word-break:break-all}
</style></head><body><div class="w">
<h1>카드뉴스 메이커</h1><p class="sub">주제만 입력하면 AI가 카피를 쓰고, 사진 위에 올려 카드로 만들어요.</p>

<section id="s1">
<div class="p"><h3>타겟 설정</h3><div class="row"><div><label>페르소나</label><input id="per" placeholder="예: 30대 직장인"></div><div><label>욕구 / 주제 (링크 내용은 여기에 요약해 적어도 돼요)</label><input id="des" placeholder="예: 퇴근 후 부업으로 월 100만원 벌려면"></div></div>
<div class="row" style="margin-top:10px"><div><label>채널명 (카드 상단 배지)</label><input id="ch" value="오늘의쓸모"></div><div><label>계정 아이디 (마지막 장에 표시, 선택)</label><input id="hd" value="@today.worthy" placeholder="@my_account"></div></div></div>
<div class="p"><h3>📰 화제 뉴스로 시작하기 <span style="font-weight:400;color:var(--mu)">(선택)</span></h3>
<div class="chips" style="margin-bottom:10px"><a class="chip nl" href="https://news.naver.com/main/ranking/popularDay.naver" target="_blank" rel="noopener">네이버 많이 본 뉴스</a><a class="chip nl" href="https://news.google.com/?hl=ko&gl=KR&ceid=KR:ko" target="_blank" rel="noopener">구글 뉴스</a><a class="chip nl" href="https://trends.google.co.kr/trending?geo=KR" target="_blank" rel="noopener">구글 트렌드</a></div>
<label>기사 원문 또는 요약 붙여넣기 — 링크에서 마음에 드는 기사를 복사해 넣으세요</label><textarea id="art" rows="4" placeholder="기사 본문이나 유튜브 스크립트를 붙여넣으면 그 내용만 바탕으로 만들어요. 링크(URL)는 읽을 수 없어요."></textarea>
<div class="row" style="margin-top:10px"><div><label>출처 (게시물 본문 끝에 표기)</label><input id="src" placeholder="예: ○○일보, 2026.10.13"></div></div></div>
<div class="p"><h3>인지단계</h3><div class="chips" id="cAw"></div></div>
<div class="p"><h3>카테고리</h3><div class="chips" id="cCat"></div></div>
<div class="p row"><div><h3>템플릿 색상</h3><div class="chips" id="cCol"></div></div><div><h3>카드 매수</h3><div class="chips" id="cN"></div></div></div>
<div class="p"><label style="display:flex;gap:8px;align-items:center;margin:0;color:var(--tx);font-size:14px"><input type="checkbox" id="hs" checked style="width:auto"> 해시태그 자동생성</label></div>
<button class="big" id="g1">🚀 카피 후킹 생성하기</button><div class="msg" id="m1"></div>
</section>

<section id="s2" hidden><div class="p"><h3>🎯 AI가 파악한 핵심 논점</h3><textarea id="core" rows="2"></textarea><div class="msg" style="margin-top:4px">틀렸거나 아쉬우면 직접 고친 뒤 아래 "🔄 이 핵심으로 다시 생성"을 누르세요.</div></div>
<div class="p"><h3>🔥 후킹 카피 선택 <span style="font-weight:400;color:var(--mu)">(하나를 고르세요)</span></h3><div id="hooks"></div><label style="margin-top:6px">또는 직접 쓰기</label><div class="row"><input id="myhook" placeholder="예: 코인 현물은 세금 내는데, 선물은 0원?" style="flex:3"><button id="usemy" style="flex:1">이 카피로 만들기</button></div>
<div class="bar"><button class="g" id="back1">← 처음부터</button><button class="g" id="g1b">🔄 이 핵심으로 다시 생성</button></div><div class="msg" id="m2"></div></div></section>

<section id="s3" hidden>
<div class="p"><h3>스타일</h3><div class="chips" id="cSty"></div></div>
<div class="p"><h3>카드 미리보기 <span style="font-weight:400;color:var(--mu)" id="cap"></span></h3><div id="strip"></div>
<input type="file" id="file" accept="image/*,video/*" multiple hidden>
<div id="ed" style="margin-top:8px"></div><div class="tags" id="tg"></div></div>
<div class="p"><h3>📝 게시물 본문 <span style="font-weight:400;color:var(--mu)">(요약 · 출처 · 해시태그, 직접 고쳐도 돼요)</span></h3><textarea id="capt" rows="10"></textarea><div class="bar"><button class="g" id="capc">본문 복사</button></div></div>
<div class="bar"><button class="g" id="back2">← 후킹 다시 고르기</button><button class="g" id="cp">📋 클립보드 복사</button><button class="g" id="csv">📄 CSV 저장</button><button class="g" id="ipall">🎨 전체 사진 프롬프트 복사</button><button class="g" id="aiall">✨ 전체 AI 일러스트</button><button class="g" id="one">현재 카드 저장</button><button id="all">📥 전체 저장 (사진 PNG · 영상 MP4)</button></div><div class="msg" id="m3"></div><textarea id="ipbox" rows="6" hidden style="margin-top:8px"></textarea>
</section>
</div>
<script>
const $=id=>document.getElementById(id),W=1080,H=1350,F='"Noto Sans KR",sans-serif',FT='"PretendardT","Noto Sans KR",sans-serif';
const AW=[['무인지','문제를 모름'],['문제인지','문제는 알지만 해결책 모름'],['솔루션인지','해결책은 알지만 제품 모름'],['제품인지','제품은 알지만 확신 없음']];
const CAT=['뉴스/트렌드','정보/팁','마케팅/홍보','라이프/감성'],COL=['#1f3a2a','#4a3322','#14233f','#f1f1ec'],NN=[5,7,10];
const STY=[['photo','포토형'],['bold','볼드형'],['mag','매거진형'],['min','미니멀']];
const URLRE=/https?:\/\/\S+/g,A=()=>$('art').value.replace(URLRE,'').trim(),hasUrl=()=>/https?:\/\//.test($('art').value);
const NOURL='링크는 앱이 직접 읽을 수 없어요. 유튜브는 영상 설명란의 "스크립트 표시"를 복사해 붙여넣거나, 핵심 내용을 주제 칸에 한두 문장으로 적어주세요.';
let st={aw:1,cat:0,col:0,n:1,sty:'photo'},hooks=[],S=[],tags=[],cur=0,hook=null,pickIdx=0,cap='';
function fullCap(){const src=$('src').value.trim();return cap.trim()+(src?'\n\n출처: '+src:'')+(tags.length?'\n\n'+tags.map(x=>'#'+x).join(' '):'')}
function chips(id,arr,key,fmt,sw){const el=$(id);el.innerHTML='';arr.forEach((a,i)=>{const b=document.createElement('button');const v=sw?COL[i]:(key==='sty'?a[0]:i);
 b.className='chip'+(sw?' sw':'')+((st[key]===v)?' on':'');if(sw)b.style.background=a;else b.innerHTML=fmt(a);
 b.onclick=()=>{st[key]=v;chips(id,arr,key,fmt,sw);if(key==='sty'||key==='col')renderCards()};el.appendChild(b)})}
function initChips(){chips('cAw',AW,'aw',a=>a[0]+'<small>'+a[1]+'</small>');chips('cCat',CAT,'cat',a=>a);
 const col=$('cCol');col.innerHTML='';COL.forEach((c,i)=>{const b=document.createElement('button');b.className='chip sw'+(st.col===i?' on':'');b.style.background=c;b.style.border='1px solid #8884';b.onclick=()=>{st.col=i;initChips();if(!$('s3').hidden)renderCards()};col.appendChild(b)});
 const n=$('cN');n.innerHTML='';NN.forEach((v,i)=>{const b=document.createElement('button');b.className='chip'+(st.n===i?' on':'');b.textContent=v+'장';b.style.textAlign='center';b.onclick=()=>{st.n=i;initChips()};n.appendChild(b)});
 chips('cSty',STY,'sty',a=>a[1])}
function wrap(c,t,max){const o=[];for(const p of String(t||'').split('\n')){let l='';for(const w of p.split(/(\s+)/)){if(!w)continue;if(c.measureText(l+w).width<=max){l+=w;continue}if(l.trim())o.push(l.trimEnd());l=w.trimStart();while(l&&c.measureText(l).width>max){let k=l.length;while(k>1&&c.measureText(l.slice(0,k)).width>max)k--;o.push(l.slice(0,k));l=l.slice(k)}}o.push(l)}return o}

function rich(c,l,x,y,al,fg,hl,st8){const runs=[];let cur='',q=st8.q;const Q="'‘’";
 for(const ch of l){if(Q.includes(ch)){if(!q){if(cur)runs.push([cur,false]);cur='';q=true}else{runs.push([cur,true]);cur='';q=false}}else cur+=ch}
 if(cur)runs.push([cur,q]);st8.q=q;const w=runs.reduce((a,r)=>a+c.measureText(r[0]).width,0);let sx=al==='center'?x-w/2:x;c.textAlign='left';
 for(const [t,h] of runs){c.fillStyle=h?hl:fg;c.fillText(t,sx,y);sx+=c.measureText(t).width}}
function richBold(c,l,x,y,fg,bf,st8){const parts=l.split('**');let sx=x;parts.forEach((t,k)=>{if(k>0)st8.b=!st8.b;if(!t)return;c.font=(st8.b?'700 ':'400 ')+st8.sz+'px '+F;c.fillStyle=st8.b?bf:fg;c.fillText(t,sx,y);sx+=c.measureText(t).width})}
function infoBlock(c,s,o){const ts=o.ts,ss=36,bs=33,lh=bs*1.62;c.font='400 '+ts+'px '+FT;const tl=wrap(c,s.t,o.max);c.font='700 '+ss+'px '+F;const sl=s.sub?wrap(c,s.sub,o.max):[];c.font='700 '+bs+'px '+F;const bl=wrap(c,String(s.b||''),o.max);

 c.textAlign='left';const qs={q:false};c.font='400 '+ts+'px '+FT;tl.forEach((l,k)=>rich(c,l,o.x,y+ts+k*ts*1.25,'left','#fff','#FFD84D',qs));y+=th+26;
 c.font='700 '+ss+'px '+F;c.fillStyle='#fff';sl.forEach((l,k)=>c.fillText(l,o.x,y+ss+k*ss*1.45));y+=sh;
 const bst={b:false,sz:bs};bl.forEach((l,k)=>richBold(c,l,o.x,y+bs+k*lh,'rgba(255,255,255,.86)','#fff',bst));return top}
function block(c,s,o){const bs=40,tl=(c.font='400 '+o.ts+'px '+FT,wrap(c,s.t,o.max)),bl=(c.font='400 '+bs+'px '+F,wrap(c,s.b,o.max));
 const th=tl.length*o.ts*1.22,bh=bl.length*bs*1.6,g=bl.length?34:0,tot=th+g+bh;let y=o.mode==='bottom'?o.y-tot:o.mode==='mid'?o.y-tot/2:o.y;const top=y;
 c.textAlign=o.al;c.fillStyle=o.fg;c.font='400 '+o.ts+'px '+FT;const qs={q:false},hl=o.hl||(o.fg==='#fff'?'#FFD84D':'#C2410C');tl.forEach((l,k)=>rich(c,l,o.x,y+o.ts+k*o.ts*1.22,o.al,o.fg,hl,qs));c.textAlign=o.al;y+=th+g;
 c.fillStyle=o.sub;c.font='400 '+bs+'px '+F;bl.forEach((l,k)=>c.fillText(l,o.x,y+bs+k*bs*1.6));return top}
function handleTag(c,x,y,fg){const t=($('hd').value||$('ch').value||'').replace(/^@/,'').toUpperCase();if(!t)return;c.save();c.shadowColor='rgba(0,0,0,.45)';c.shadowBlur=10;c.fillStyle='#FFD84D';c.beginPath();c.arc(x+9,y-11,9,0,7);c.fill();c.font='800 30px '+F;try{c.letterSpacing='1.5px'}catch(e){}c.textAlign='left';c.fillStyle=fg;c.fillText(t,x+30,y);c.restore()}

async function genHooks(keep){const per=$('per').value.trim(),des=$('des').value.trim();const art=A();if(!des&&!art){$('m1').textContent=hasUrl()?NOURL:'주제를 입력하거나 기사 원문을 붙여넣어주세요.';return}
 if(art&&art.length<40&&!des){$('m1').textContent='붙여넣은 내용이 너무 짧아요. 핵심 내용을 주제 칸에 적어주세요.';return}
 const sm=await smp();if(!sm){$('m1').textContent='AI 생성은 이 화면에서 사용할 수 없어요.';return}
 const fixed=keep?$('core').value.trim():'',angs=ANG[st.cat];
 $('g1').disabled=$('g1b').disabled=true;$('m1').textContent=$('m2').textContent='핵심을 파악하고 후킹 카피를 만드는 중...';
 try{const r=await sm.json(`당신은 저장·공유가 많이 되는 한국 인스타 카드뉴스 에디터입니다.
[자료]
주제: ${des||'(아래 원문에서 도출)'}
${art?'원문(이 내용의 사실만 사용):\n'+art.slice(0,6000)+'\n':''}타깃: ${per||'일반 대중'} / 인지단계: ${AW[st.aw][0]}(${AW[st.aw][1]}) / 카테고리: ${CAT[st.cat]}
${fixed?'핵심 논점(확정됨, core에 그대로 넣을 것): '+fixed:''}
[1단계] ${fixed?'위 핵심 논점을 그대로 사용하세요.':'자료에서 사람들이 놀라거나 논쟁할 "핵심 논점"을 한 문장으로 뽑으세요. 무엇이 무엇과 다르거나 모순되는지(긴장)가 드러나야 합니다.'}
[2단계] 표지 후킹 카피 5개. 앵글은 순서대로: ${angs.map(a=>a[0]).join(', ')}.
규칙:
- 모든 카피는 핵심 논점의 긴장(대비·모순·빈틈)을 직접 담을 것. 주제를 바꿔도 붙일 수 있는 일반론("모르면 손해", "꼭 알아야 할 N가지", "이런 고민 있으셨죠") 금지.
- 구체적인 대상을 이름으로 넣을 것(예: 코인 선물, 해외 거래소). 타깃 이름(페르소나)은 제목에 넣지 말 것.
- 15~28자, 말하듯 짧게. 물음표, "A는 ~, B는 ~" 대비, 반전 구조를 활용.
- 자료에 없는 수치·사실 금지, 과장·낚시 금지. 위법이나 회피 방법을 권하는 것처럼 읽히지 않게 '쟁점'으로 전달.
- score는 1~10, 표지를 보고 넘겨볼 가능성 기준으로 냉정하게.
JSON만: {"core":"","hooks":[{"angle":"","title":"","why":"한 줄 설명","score":7.5}]}`,{cache:false});
  core=fixed||String(r.core||'');$('core').value=core;
  hooks=(r.hooks||[]).slice(0,5);$('hooks').innerHTML='';
  hooks.forEach(h=>{const f=angs.find(a=>a[0]===h.angle);const b=document.createElement('button');b.className='hk';b.innerHTML='<b></b><i></i><p></p><small></small>';b.children[0].textContent=(f?f[1]:'🔥')+' '+h.angle;b.children[1].textContent=h.score+'점';b.children[2].textContent='"'+h.title+'"';b.children[3].textContent=h.why;b.onclick=()=>genCards(h);$('hooks').appendChild(b)});
  $('s1').hidden=true;$('s3').hidden=true;$('s2').hidden=false;$('m1').textContent=$('m2').textContent='';
 }catch(e){$('m1').textContent=$('m2').textContent=e.code==='not_granted'?'AI 사용 권한이 필요해요.':'생성에 실패했어요. 다시 시도해주세요.'}
 $('g1').disabled=$('g1b').disabled=false}
async function genCards(h){hook=h;const n=NN[st.n],sm=await smp();$('m2').textContent='카드 문구를 만드는 중...';document.querySelectorAll('.hk').forEach(b=>b.disabled=true);
 try{const r=await sm.json(`인스타 카드뉴스 ${n}장을 한국어로 작성하세요.
${A()?'기사 원문(이 내용의 사실만 사용, 없는 수치·사실 추가 금지): '+A().slice(0,6000)+'\n':''}페르소나: ${$('per').value||'일반 대중'} / 주제: ${$('des').value||'(기사 내용에서 도출)'} / 인지단계: ${AW[st.aw][0]} / 카테고리: ${CAT[st.cat]}
핵심 논점(모든 카드가 이 논점을 중심으로 전개되게): ${$('core').value.trim()||core||'(자료에서 도출)'}
선택한 후킹: "${h.title}" (${h.angle} 앵글)
구성: 1장=표지(t=후킹 제목 그대로 또는 다듬어 28자 이내, b=부제 25자 이내), 2~${n-1}장=핵심 포인트(t=20자 이내, b=1~2문장 70자 이내), ${n}장=팔로우 유도 마무리(t=팔로우를 권하는 한 줄 18자 이내 예: '팔로우하고 먼저 받아보세요', b=팔로우하면 어떤 소식을 계속 받는지 40자 이내 한 줄).
카드마다 kw=사진 검색어(영어 2~4단어, 무료 사진 사이트에서 찾기 좋은 구체적 장면), ip=AI 사진 생성용 영어 프롬프트(photorealistic 실사 사진. 카드 내용의 감정이 드러나는 구체적 장면 하나, 필요하면 Korean 인물(실존 인물 아님), 장소·조명·분위기·카메라 구도를 명시, cinematic natural lighting, 아래쪽 1/3은 비교적 단순한 배경, 글자·로고·브랜드 없음, vertical 4:5, 2~3문장). ${$('hs').checked?'hashtags=해시태그 8개(#없이).':'hashtags는 빈 배열.'}
caption=인스타 게시물 본문: 첫 줄은 시선을 끄는 한 줄, 빈 줄 후 핵심 요약 3~5줄(줄마다 줄바꿈, 이모지 한두 개 가능), 빈 줄 후 팔로우 유도 한 줄. 해시태그와 출처는 넣지 말 것. 400자 이내.
확인되지 않은 통계·수치는 만들지 말 것. JSON만: {"slides":[{"t":"","b":"","kw":"","ip":""}],"hashtags":[""],"caption":""} 슬라이드 정확히 ${n}개.`,{cache:false});
  S=r.slides.map(x=>({t:String(x.t||''),b:String(x.b||''),kw:String(x.kw||''),ip:String(x.ip||'')}));tags=(r.hashtags||[]).map(String);cap=String(r.caption||'');cur=0;
  $('s2').hidden=true;$('s3').hidden=false;$('m2').textContent='';renderCards();$('capt').value=fullCap()
 }catch(e){$('m2').textContent='카드 생성에 실패했어요. 다시 눌러주세요.'}
 document.querySelectorAll('.hk').forEach(b=>b.disabled=false)}
$('g1').onclick=()=>genHooks(false);$('g1b').onclick=()=>genHooks(true);
$('usemy').onclick=()=>{const t=$('myhook').value.trim();if(!t){$('m2').textContent='카피를 입력해주세요.';return}genCards({angle:'직접 작성',title:t})};
$('back1').onclick=()=>{$('s2').hidden=true;$('s1').hidden=false};$('back2').onclick=()=>{$('s3').hidden=true;$('s2').hidden=false};
async function save(name,data){const dl=await claude.use('downloads');if(!dl){$('m3').textContent='이 화면에서는 저장을 사용할 수 없어요.';return false}
 try{await dl.save({filename:name,data});return true}catch(e){if(e.code!=='declined')$('m3').textContent='저장 실패: '+(e.message||e.code);return false}}
$('all').onclick=async()=>{for(let i=0;i<S.length;i++){if(!await saveCard(i))break}};
$('one').onclick=()=>saveCard(cur);
$('csv').onclick=()=>{const q=v=>'"'+String(v).replace(/"/g,'""')+'"';const t='\ufeff번호,제목,본문,사진검색어\n'+S.map((s,i)=>[i+1,q(s.t),q(s.b),q(s.kw)].join(',')).join('\n')+'\n'+(tags.length?'해시태그,'+q(tags.map(x=>'#'+x).join(' ')):'');save('cardnews.csv',new Blob([t],{type:'text/csv'}))};
$('cp').onclick=async()=>{const t=S.map((s,i)=>(i+1)+'. '+s.t+'\n'+s.b).join('\n\n')+(tags.length?'\n\n'+tags.map(x=>'#'+x).join(' '):'');try{await navigator.clipboard.writeText(t);$('m3').textContent='복사했어요.'}catch(e){$('m3').textContent='이 화면에서는 복사가 막혀 있어요. CSV로 저장해주세요.'}};
$('ipall').onclick=async()=>{const t='아래 장면으로 인스타그램 카드뉴스 배경 사진을 장면마다 1장씩, 총 '+S.length+'장 만들어줘. 모두 세로 4:5 비율의 실사 사진으로, 같은 톤과 색감으로 통일하고, 이미지 안에 글자는 넣지 마.\n\n'+S.map((s,i)=>(i+1)+'. '+(s.ip||s.kw||s.t)).join('\n');try{await navigator.clipboard.writeText(t);$('m3').textContent='복사했어요. ChatGPT 등에 붙여넣고, 받은 사진들을 1번 카드 위로 한꺼번에 끌어다 놓으면 순서대로 들어가요.'}catch(e){$('ipbox').hidden=false;$('ipbox').value=t;$('ipbox').select();$('m3').textContent='복사가 막혀 있어요. 아래 칸의 내용을 복사해주세요.'}};
$('aiall').onclick=async()=>{const todo=S.map((s,i)=>i).filter(i=>!S[i].img&&!S[i].vid);if(!todo.length){$('m3').textContent='모든 카드에 이미 사진이나 영상이 있어요.';return}
 for(let k=0;k<todo.length;k++){$('m3').textContent='일러스트 그리는 중... '+(k+1)+'/'+todo.length+'장 (장당 20~40초)';if(!await genIllu(todo[k],true))return}$('m3').textContent='일러스트를 모두 넣었어요. 마음에 안 드는 카드는 그 카드에서 다시 만들 수 있어요.'};
$('capc').onclick=async()=>{try{await navigator.clipboard.writeText($('capt').value);$('capc').textContent='복사됨'}catch(e){$('capt').select();$('capc').textContent='선택됨 · Ctrl/Cmd+C로 복사'}setTimeout(()=>$('capc').textContent='본문 복사',2000)};
initChips();if(document.fonts)Promise.all(['400','700','900'].map(w=>document.fonts.load(w+' 40px "Noto Sans KR"'))).catch(()=>{});
