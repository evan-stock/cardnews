<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@700;900&display=block" rel="stylesheet">
<style>
@font-face{font-family:"PretendardT";src:url("../assets/fonts/Pretendard-ExtraBold.otf") format("opentype");font-weight:400;font-display:block}
html,body{margin:0;background:#000}
#c{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000}
#c img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.88) 0%,rgba(0,0,0,.72) 30%,rgba(0,0,0,0) 52%,rgba(0,0,0,0) 78%,rgba(0,0,0,.55) 100%)}
.box{position:absolute;left:80px;right:80px;top:300px}
.tag{display:inline-flex;align-items:center;gap:16px;background:#E5252A;color:#fff;font:900 42px 'Noto Sans KR';padding:12px 28px;border-radius:14px;letter-spacing:1px}
.tag i{width:20px;height:20px;border-radius:50%;background:#fff;display:inline-block}
h1{margin:34px 0 0;font:400 118px/1.22 'PretendardT';color:#fff;text-shadow:0 6px 24px rgba(0,0,0,.6);word-break:keep-all}
h1 em{font-style:normal;color:#FFD84D}
.sub{margin-top:26px;font:700 46px 'Noto Sans KR';color:rgba(255,255,255,.92);text-shadow:0 3px 12px rgba(0,0,0,.7)}
.hd{position:absolute;left:80px;top:220px;font:800 32px 'Noto Sans KR';color:#fff;letter-spacing:1.5px;display:flex;align-items:center;gap:12px}
.hd b{width:16px;height:16px;border-radius:50%;background:#FFD84D;display:inline-block}
</style></head><body><div id="c"><img id="bg"><div class="shade"></div>
<div class="hd"><b></b><span id="hd"></span></div>
<div class="box"><div class="tag" id="tagw"><i></i><span id="tag"></span></div><h1 id="t"></h1><div class="sub" id="sub"></div></div></div></body></html>
