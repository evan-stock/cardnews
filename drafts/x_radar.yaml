# 채널 성격에 맞는 글만 알린다. 아래 어느 채널에도 안 걸리면 조회수 200만(big_views)을 넘을 때만 알림.
#   words: 본문에 이 낱말이 있으면 해당 / accounts: 이 계정 글은 모두 해당 / video_langs: 이 언어의 영상 글은 모두 해당
channels:
  오늘의쓸모:
    video_langs: [en, ja, es, pt, fr, de, zh]   # 해외 '와' 실제 영상
    words: [로봇, 휴머노이드, 로켓, 우주, 테슬라, 자율주행, AI, 인공지능, 신기술, 세계 최초, 연구 결과, 과학자, 건강, 의사,
            대통령, 이재명, 민주당, 국민의힘, 국회, 정부, 장관, 검찰, 특혜, 세금, 논란, 사고, 구조, 체포, 시위, 폭동, 해외에서,
            robot, humanoid, rocket, starship, world first, footage, caught on camera]
  ㅋㅋ상회:
    accounts: [nowyeosi, nowgeun, zzzzzzzikkkkk, kjibak, kingwest0219, argent_wave, eom0x]   # 커뮤 유머·썰 계정
    words: [ㅋㅋㅋ, 레전드, 웃긴, 웃음, 드립, 밈, 짤, 근황, 실화냐, 에바, ㄷㄷ]
  더피드:
