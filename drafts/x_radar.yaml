# 엑스 급상승 감지 설정 (scripts/x_radar.py, 워크플로 x-radar)
# 이 파일을 고쳐 push 하면 다음 실행부터 반영된다.

# 지켜볼 계정(@ 없이). 소재가 자주 나오는 계정을 넣는다. 계정의 최근 글이 자동으로 후보가 된다.
accounts: []

# 바로 추적할 게시물 주소. 채팅에서 엑스 검색으로 찾은 글이나 눈에 띈 글을 넣는다(30시간 지나면 자동으로 빠짐).
inbox: []

# 알림 기준(비우면 기본값)
rules:
  max_age_h: 12        # 올린 지 이 시간 안의 글만 알림
  min_views: 30000     # 이 조회수부터 판단
  views_per_h: 100000  # 지금 시간당 조회수 증가가 이 이상이면 알림
  likes_per_h: 2000    # 또는 시간당 좋아요 증가
  reach_ratio: 3.0     # 또는 6시간 안에 조회수가 팔로워의 3배 이상
  langs: []            # 예: [ko, en, ja]. 비우면 전부
  video_only: false    # true 면 영상 글만
