# 본문에 이 낱말이 있으면 알리지 않는다(소재 기준에서 빼는 것: 주식·코인, 외모·성적 썰 등)
exclude: [코인, 비트코인, 급등주, 종목, 매수, 성괴, 골반, 못생, 섹스, 야동, 19금]

# 알림 기준(비우면 기본값)
rules:
  max_age_h: 12        # 올린 지 이 시간 안의 글만 알림
  min_views: 200000    # 조회수 이 이상만 알림
  min_likes: 1500      # 좋아요 이 이상만 알림
  views_per_h: 100000  # 지금 시간당 조회수 증가가 이 이상이면 알림
  likes_per_h: 2000    # 또는 시간당 좋아요 증가
  reach_ratio: 3.0     # 또는 6시간 안에 조회수가 팔로워의 3배 이상(위 조회수·좋아요 기준은 그대로 적용)
  big_views: 2000000   # 주제가 안 맞아도 이 조회수를 넘으면 알림
  langs: []            # 예: [ko, en, ja]. 비우면 전부
  video_only: false    # true 면 영상 글만
