3cbr\u003e[박정훈/국민의힘 의원 (어제) : 귀에다가는 소형 그걸 넣고 이렇게 한다는 거잖아요. 장관님 100% 잡아낼 자신 있어요?]\u003cbr\u003e\u003cbr\u003e[최교진/교육부 장관 (어제) : 제 나이가 있어서 그런지 저는 못 할 것 같습니다.]\u003cbr\u003e\u003cbr\u003e최 장관은 답을 떠넘기기도 했습니다.\u003cbr\u003e\u003cbr\u003e[최교진/교육부 장관 (어제) : 네, 우리 국장님 답변해주시면 좋겠습니다.]\u003cbr\u003e\u003cbr\u003e[박정훈/국민의힘 의원 (어제) : 아니, 제가 우리 장관님한테 여쭤봤잖아요. 자신 있냐고요. 아, 미치겠네. 정말 진짜…]\u003cbr\u003e\u003cbr\u003e이런 무책임한 태도에 국민들의 반발이 커질까 여당에서도 난감하다는 반응이 나오는 상황.\u003cbr\u003e\u003cbr\u003e[김민석/더불어민주당 대표 (유튜브 '민주당TV') : 그 부분을 빨리 정정하고 했어야 된다고 생각이 들고요. 하여간 우려를 자아내는 그런 장면이었다고 생각합니다.]\u003cbr\u003e\u003cbr\u003e야당은 강한 비판을 쏟아냈습니다.\u003cbr\u003e\u003cbr\u003e[박충권/국민의힘 수석대변인 : 수험생과 학부모는 뒷목을 잡고 분노하고 있습니다.]\u003cbr\u003e\u003cbr\u003e최 장관과 한성숙 국무총리에 대한 해임건의안을 발의하겠다고도 했습니다.\u003cbr\u003e\u003cbr\u003e[임이자/국민의힘 정책위의장 : 수능 끝나고 원내 지도부와 상의해서 바로 절차에 돌입하도록 하겠습니다. 정부가 기강이 무너지고 여기에 대한 너무 안일한 무능, 이런 부분에 대해선 책임을 묻지 않을 수가 없습니다.]83:T9f2,[앵커]\n\n오늘 국무총리의 대국민 담화 자리엔 교육부 차관이 왔고, 교육부 장관은 참석하지 않았습니다. 참석하지 못했다는 것이 더 정확한 표현일 지도 모르겠습니다. 어제 국회에서 사안의 경중도, 민심의 온도도, 읽지 못하는 언행을 보이자, 오늘 담화에서 배제된 것으로 보입니다. 야당은 교육부장관 해임건의안을 제출할 계획입니다.\n\n채승기 기자입니다.\n\n[기자]\n\n시험장 안에서 구체적으로 어떤 점검이 이뤄지는지 설명한 건, 최교진 교육부 장관이 아닌 최은옥 차관이었습니다.\n\n[최은옥/교육부 차관 : 1교시 시작할 때 (단추에 스티커를) 붙입니다. 그것을 시험 종료될 때까지 떼지 않도록 권고하고요. 중간에 떨어지는 경우가 있으면 그거는 재부착하는 데는 시간이 걸리지 않기 때문에…]\n\n교육부 수장을 오늘 담화·대책 발표 때 배석시키지 않은 건, 전날 국회에서의 답변 때문이라는 해석이 나옵니다.\n\n[박정훈/국민의힘 의원 (어제) : 귀에다가는 소형 그걸 넣고 이렇게 한다는 거잖아요. 장관님 100% 잡아낼 자신 있어요?]\n\n[최교진/교육부 장관 (어제) : 제 나이가 있어서 그런지 저는 못 할 것 같습니다.]\n\n최 장관은 답을 떠넘기기도 했습니다.\n\n[최교진/교육부 장관 (어제) : 네, 우리 국장님 답변해주시면 좋겠습니다.]\n\n[박정훈/국민의힘 의원 (어제) : 아니, 제가 우리 장관님한테 여쭤봤잖아요. 자신 있냐고요. 아, 미치겠네. 정말 진짜…]\n\n이런 무책임한 태도에 국민들의 반발이 커질까 여당에서도 난감하다는 반응이 나오는 상황.\n\n[김민석/더불어민주당 대표 (유튜브 '민주당TV') : 그 부분을 빨리 정정하고 했어야 된다고 생각이 들고요. 하여간 우려를 자아내는 그런 장면이었다고 생각합니다.]\n\n야당은 강한 비판을 쏟아냈습니다.\n\n[박충권/국민의힘 수석대변인 : 수험생과 학부모는 뒷목을 잡고 분노하고 있습니다.]\n\n최 장관과 한성숙 국무총리에 대한 해임건의안을 발의하겠다고도 했습니다.\n\n[임이자/국민의힘 정책위의장 : 수능 끝나고 원내 지도부와 상의해서 바로 절차에 돌입하도록 하겠습니다. 정부가 기강이 무너지고 여기에 대한 너무 안일한 무능, 이런 부분에  것으로 보입니다. 야당은 교육부장관 해임건의안을 제출할 계획입니다.\u003cbr\u003e\u003cbr\u003e채승기 기자입니다.\u003cbr\u003e\u003cbr\u003e[기자]\u003cbr\u003e\u003cbr\u003e시험장 안에서 구체적으로 어떤 점검이 이뤄지는지 설명한 건, 최교진 교육부 장관이 아닌 최은옥 차관이었습니다.\u003cbr\u003e\u003cbr\u003e[최은옥/교육부 차관 : 1교시 시작할 때 (단추에 스티커를) 붙입니다. 그것을 시험 종료될 때까지 떼지 않도록 권고하고요. 중간에 떨어지는 경우가 있으면 그거는 재부착하는 데는 시간이 걸리지 않기 때문에…]\u003cbr\u003e\u003cbr\u003e교육부 수장을 오늘 담화·대책 발표 때 배석시키지 않은 건, 전날 국회에서의 답변 때문이라는 해석이 나옵니다.\u003cbr\u003e\u003cbr\u003e[박정훈/국민의힘 의원 (어제) : 귀에다가는 소형 그걸 넣고 이렇게 한다는 거잖아요. 장관님 100% 잡아낼 자신 있어요?]\u003cbr\u003e\u003cbr\u003e[최교진/교육부 장관 (어제) : 제 나이가 있어서 그런지 저는 못 할 것 같습니다.]\u003cbr\u003e\u003cbr\u003e최 장관은 답을 떠넘기기도 했습니다.\u003cbr\u003e\u003cbr\u003e[최교진/교육부 장관 (어제) : 네, 우리 국장님 답변해주시면 좋겠습니다.]\u003cbr\u003e\u003cbr\u003e[박정훈/국민의힘 의원 (어제) : 아니, 제가 우리 장관님한테 여쭤봤잖아요. 자신 있냐고요. 아, 미치겠네. 정말 진짜…]\u003cbr\u003e\u003cbr\u003e이런 무책임한 태도에 국민들의 반발이 커질까 여당에서도 난감하다는 반응이 나오는 상황.\u003cbr\u003e\u003cbr\u003e[김민석/더불어민주당 대표 (유튜브 '민주당TV') : 그 부분을 빨리 정정하고 했어야 된다고 생각이 들고요. 하여간 우려를 자아내는 그런 장면이었다고 생각합니다.]\u003cbr\u003e\u003cbr\u003e야당은 강한 비판을 쏟아냈습니다.\u003cbr\u003e\u003cbr\u003e[박충권/국민의힘 수석대변인 : 수험생과 학부모는 뒷목을 잡고 분노하고 있습니다.]\u003cbr\u003e\u003cbr\u003e최 장관과 한성숙 국무총리에 대한 해임건의안을 발의하겠다고도 했습니다.\u003cbr\u003e\u003cbr\u003e[임이자/국민의힘 정책위의장 : 수능 끝나고 원내 지도부와 상의해서 바로 절차에 돌입하도록 하겠습니다. 정부가 기강이 무너지고 여기에 대한 너무 안일한 무능, 이런 부분에 대해선 책임을 묻지 않을 수가 없습니다.]","articleInnerTextContent":"[앵커]\n\n오늘 국무총리의 대국민 담화 자리엔 교육부 차관이 왔고, 교육부 장관은 참석하지 않았습니다. 참석하지 못했다는 것이 더 정확한 표현일 지도 모르겠습니다. 어제 국회에서 사안의 경중도, 민심의 온도도, 읽지 못하는 언행을 보이자, 오늘 담화에서 배제된 것으로 보입니다. 야당은 교육부장관 해임건의안을 제출할 계획입니다.\n\n채승기 기자입니다.\n\n[기자]\n\n시험장 안에서 구체적으로 어떤 점검이 이뤄지는지 설명한 건, 최교진 교육부 장관이 아닌 최은옥 차관이었습니다.\n\n[최은옥/교육부 차관 : 1교시 시작할 때 (단추에 스티커를) 붙입니다. 그것을 시험 종료될 때까지 떼지 않도록 권고하고요. 중간에 떨어지는 경우가 있으면 그거는 재부착하는 데는 시간이 걸리지 않기 때문에…]\n\n교육부 수장을 오늘 담화·대책 발표 때 배석시키지 않은 건, 전날 국회에서의 답변 때문이라는 해석이 나옵니다.\n\n[박정훈/국민의힘 의원 (어제) : 귀에다가는 소형 그걸 넣고 이렇게 한다는 거잖아요. 장관님 100% 잡아낼 자신 있어요?]\n\n[최교진/교육부 장관 (어제) : 제 나이가 있어서 그런지 저는 못 할 것 같습니다.]\n\n최 장관은 답을 떠넘기기도 했습니다.\n\n[최교진/교육부 장관 (어제) : 네, 우리 국장님 답변해주시면 좋겠습니다.]\n\n[박정훈/국민의힘 의원 (어제) : 아니, 제가 우리 장관님한테 여쭤봤잖아요. 자신 있냐고요. 아, 미치겠네. 정말 진짜…]\n\n이런 무책임한 태도에 국민들의 반발이 커질까 여당에서도 난감하다는 반응이 나오는 상황.\n\n[김민석/더불어민주당 대표 (유튜브 '민주당TV') : 그 부분을 빨리 정정하고 했어야 된다고 생각이 들고요. 하여간 우려를 자아내는 그런 장면이었다고 생각합니다.]\n\n야당은 강한 비판을 쏟아냈습니다.\n\n[박충권/국민의힘 수석대변인 : 수험생과 학부모는 뒷목을 잡고 분노하고 있습니다.]\n\n최 장관과 한성숙 국무총리에 대한 해임건의안을 발의하겠다고도 했습니다.\n\n[임이자/국민의힘 정책위의장 : 수능 끝나고 원내 지도부와 상의해서 바로 절차에 돌입하도록 하겠습니다. 정부가 기강이 무너지고 여기에 대한 너무 안일한 무능, 이런 부분에 대해선 책임을 묻지 않을 수가 없습니다.]","articleSummaryContent":null,"articleLikeCnt":0,"articleDislikeCnt":1,"isLike":false,"isDislike":false,"special":null,"topic":null,"issue":{"lastPublishDate":null,"packageIdx":"NK10014939","packageName":"AI 부정행위 파장","packageSummary":null,"packageCode":{"code":"ISSUE","name":"이슈"},"packageThumbnailImgUrl":null,"bgPcImgUrl":null,"bgTbImgUrl":null,"bgMoImgUrl":null,"isCommentUse":false,"tagList":[],"isFactCheck":null,"relatedArticleCnt":null,"isSubscribe":null,"upperTopicIdx":null,"isExistenceUpperTopic":null,"articleListLayoutCode":null,"relatedArticleList":[],"topicLowerIssueList":[],"bgColor":"#043A66"},"tagList":["AI 부정행위 "],"isScrap":false,"articleInputDate":"2026-11-17T16:43","articleUpdateDate":"2026-11-17T19:13","articlePublicationDate":"2026-11-17T19:13","articleThumbnailImgUrl":"https://thumb.jtbc.co.kr/photo/r600x0/news/cms/etc/2026/11/17/20261117190742710001.jpg","articleOriginImgUrl":"https://photo.jtbc.co.kr/news/cms/etc/2026/11/17/20261117190742710001.jpg","imgInfoList":[],"vodInfoList":[{"videoIdx":"ND10780656","videoType":{"code":"NORMAL","name":"일반"},"playTime":"02:06","vodThumbnailImgUrl":"https://thumb.jtbc.co.kr/photo/r600x0/news/cms/etc/2026/11/17/20261117190742710001.jpg","vodOriginImgUrl":"https://photo.jtbc.co.kr/news/cms/etc/2026/11/17/20261117190742710001.jpg"}],"mainVideoPlayCnt":189,"isComment":true,"isVideoView":false,"articleIncludeIssue":"NK10014939","journalistList":[{"journalistIdx":394,"journalistId":null,"journalistUserId":null,"journalistName":"채승기
