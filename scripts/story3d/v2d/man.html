  <filter id="ds" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#3a2410" flood-opacity=".22"/></filter>

  <g id="card"><rect x="335" y="672" width="54" height="74" rx="6" fill="#FAFBFD" stroke="#C9D2E0" stroke-width="2"/><rect x="335" y="672" width="54" height="13" rx="4" fill="#4C86E6"/>
    <circle cx="362" cy="702" r="8" fill="#4C79C9"/><rect x="351" y="711" width="22" height="13" rx="6" fill="#4C79C9"/><rect x="345" y="730" width="34" height="4" rx="2" fill="#A2ADBD"/><rect x="351" y="737" width="22" height="3" rx="1.5" fill="#C3CAD6"/>
    <rect x="355" y="664" width="14" height="12" rx="3" fill="#AEB7C2"/></g>

<!-- 머리 -->
<g id="head" filter="url(#ds)">
  <circle cx="203" cy="438" r="34" fill="#EDB89C"/><circle cx="207" cy="438" r="18" fill="#E09E83"/>
  <circle cx="517" cy="438" r="34" fill="#EDB89C"/><circle cx="513" cy="438" r="18" fill="#E09E83"/>

      <g id="eyeL" transform-origin="300 442"><ellipse cx="300" cy="442" rx="31" ry="27" fill="#fff" stroke="#E6CDBE" stroke-width="2"/><circle class="pp" cx="309" cy="444" r="13" fill="#141418"/><circle class="hl" cx="314" cy="439" r="4" fill="#fff"/></g>
      <g id="eyeR" transform-origin="420 442"><ellipse cx="420" cy="442" rx="31" ry="27" fill="#fff" stroke="#E6CDBE" stroke-width="2"/><circle class="pp" cx="429" cy="444" r="13" fill="#141418"/><circle class="hl" cx="434" cy="439" r="4" fill="#fff"/></g>
    </g>
    <ellipse cx="368" cy="474" rx="17" ry="14" fill="#F0A386"/><ellipse cx="363" cy="469" rx="6" ry="4" fill="#FFD3BF" opacity=".8"/>
    <path id="mouth" d="M334 510 Q360 528 390 508" stroke="#C44E3E" stroke-width="7" stroke-linecap="round" fill="none"/>
  </g>
</g></g>
</svg>
<script>
const $ = id => document.getElementById(id);
window.renderFrame = t => {
  const bob = Math.sin(t * Math.PI) * 5;
  $('char').setAttribute('transform', `translate(0 ${bob.toFixed(2)})`);
  $('shoes').setAttribute('transform', `translate(0 ${(-bob).toFixed(2)})`);
  $('head').setAttribute('transform', `rotate(${(Math.sin(t * Math.PI / 2) * 3).toFixed(2)} 360 560) translate(0 ${(Math.sin(t * Math.PI + 0.6) * 2).toFixed(2)})`);
  // 손 흔들기(1~3초)
  let w = 0; if (t > 0.8 && t < 3.2) { const k = Math.min(1, (t - 0.8) / 0.3, (3.2 - t) / 0.3); w = k * (-150 + Math.sin((t - 0.8) * 9) * 18); }
  $('armR').setAttribute('transform', `rotate(${w.toFixed(2)} 470 600)`);
  $('gloveR').setAttribute('transform', w < -60 ? `rotate(${(Math.sin((t - 0.8) * 9) * 10).toFixed(2)} 480 860)` : '');
  $('armL').setAttribute('transform', `rotate(${(Math.sin(t * Math.PI) * 2).toFixed(2)} 250 600)`);
  // 깜빡임
  const bl = [1.9, 3.6].some(b => t > b && t < b + 0.14) ? 0.08 : 1;
  for (const e of ['eyeL', 'eyeR']) $(e).setAttribute('transform', `translate(0 ${442 * (1 - bl)}) scale(1 ${bl})`);
  const look = t < 1 ? 0 : -14;
  document.querySelectorAll('.pp,.hl').forEach(c => c.setAttribute('transform', `translate(${look} 0)`));
  $('mouth').setAttribute('d', w < -60 ? 'M330 506 Q360 545 394 504 Q360 518 330 506 Z' : 'M334 510 Q360 528 390 508');
  $('mouth').setAttribute('fill', w < -60 ? '#8E2F2B' : 'none');
};
renderFrame(0); window.ready = true;
</script></body></html>
